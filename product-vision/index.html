<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product Vision · Juan Carlos Franco Zafra</title>
<meta name="description" content="Escribe la visión de tu producto, marca qué es hipótesis y qué es evidencia, y descubre tu siguiente experimento de customer discovery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root{
    color-scheme:dark;
    --bg:#0F1420; --surface:#1A2233; --inset:#131a28; --surface-2:#252e42;
    --text:#F2F4F8; --text-2:#c9cfda; --muted:#9AA3B2;
    --rule:rgba(255,255,255,.06); --rule-strong:rgba(255,255,255,.14);
    --yellow:#FFC53D; --on-yellow:#412402; --yellow-soft:rgba(255,197,61,.14);
    --teal:#2DD4BF; --on-teal:#04342C; --teal-soft:rgba(45,212,191,.14);
    --crit:#f0837b;
    --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-bottom:120px}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:110px}
  button{font:inherit;color:inherit}
  a{color:var(--teal);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

  .shell{max-width:880px;margin:0 auto;padding:24px 24px 40px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;margin-bottom:48px;border-bottom:1px solid var(--rule-strong)}
  .top .nombre{font-weight:600;font-size:15px;color:var(--text)}
  .top .nombre:hover{color:var(--teal);text-decoration:none}
  .seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--rule-strong)}
  .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}

  .eyebrow{font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin:0 0 14px}
  h1{font-size:clamp(32px,5vw,48px);font-weight:700;line-height:1.12;letter-spacing:-.02em;margin:0 0 16px;max-width:22ch;text-wrap:balance}
  h1 .hl{color:var(--yellow)}
  .lead{font-size:18px;color:var(--text-2);max-width:60ch;margin:0}
  .privacidad{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);margin:20px 0 0;padding:7px 12px;border:1px solid var(--rule-strong);border-radius:999px}
  .privacidad svg{flex:none;color:var(--teal)}

  .sec{margin-top:56px}
  .sec-head{margin-bottom:18px}
  .sec-n{font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--teal)}
  .sec h2{font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:4px 0 6px}
  .sec-sub{font-size:15.5px;color:var(--muted);margin:0;max-width:64ch}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
  .campos{display:grid;gap:16px;grid-template-columns:1.4fr 1fr}
  .campo label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .campo input{width:100%;font:inherit;font-size:15.5px;color:var(--text);background:var(--inset);border:1px solid var(--rule-strong);border-radius:8px;padding:10px 12px}
  .campo input::placeholder{color:var(--muted);opacity:.8}

  /* leyenda */
  .leyenda{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 20px;font-size:14px;color:var(--text-2)}
  .leyenda > span{display:inline-flex;align-items:baseline;gap:8px}
  .leyenda .sw{align-self:center}
  .sw{width:26px;height:14px;border-radius:4px;display:inline-block}
  .sw.h{background:var(--yellow-soft);border-bottom:2px dashed var(--yellow)}
  .sw.e{background:var(--teal-soft);border-bottom:2px solid var(--teal)}

  /* frase con huecos */
  .frase{font-size:20px;line-height:2.3;color:var(--text-2);margin:0}
  .slot{white-space:normal}
  .b{display:inline;padding:3px 8px;margin:0 2px;border-radius:5px;color:var(--text);font-weight:500;outline:none;cursor:text;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone;
     background:var(--surface-2);border-bottom:2px dashed var(--muted)}
  .b:empty{display:inline-block;line-height:1.5;vertical-align:baseline}
  .b:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400;font-style:italic}
  .slot.h .b:not(:empty){background:var(--yellow-soft);border-bottom:2px dashed var(--yellow)}
  .slot.e .b:not(:empty){background:var(--teal-soft);border-bottom:2px solid var(--teal)}
  .b:focus{box-shadow:0 0 0 2px var(--teal)}
  .tg{appearance:none;display:inline-flex;align-items:center;vertical-align:2px;margin:0 6px 0 2px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;line-height:1.6;cursor:pointer;white-space:nowrap;border:1px solid}
  .tg::before{content:"";width:7px;height:7px;border-radius:50%;margin-right:6px;background:currentColor}
  .slot.h .tg{color:var(--yellow);border-color:rgba(255,197,61,.45);background:transparent}
  .slot.e .tg{color:var(--teal);border-color:rgba(45,212,191,.45);background:transparent}
  .tg:hover{background:var(--surface-2)}
  .ayuda{font-size:13.5px;color:var(--muted);margin:18px 0 0}

  /* ejemplo */
  details.ej{margin-top:22px;border-top:1px solid var(--rule-strong);padding-top:16px}
  details.ej summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--teal)}
  details.ej summary::-webkit-details-marker{display:none}
  details.ej summary::before{content:"";border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
  details.ej[open] summary::before{transform:rotate(90deg)}
  .ej-panel{margin-top:12px;background:var(--inset);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .ej-caso{font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .ej-frase{font-size:16px;line-height:1.9;color:var(--text-2);margin:0}
  .ej-frase .v{padding:1px 5px;border-radius:4px;color:var(--text);-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .ej-frase .v.h{background:var(--yellow-soft);border-bottom:2px dashed var(--yellow)}
  .ej-frase .v.e{background:var(--teal-soft);border-bottom:2px solid var(--teal)}
  .ej-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:14px;font-size:14px;color:var(--text-2)}
  .ej-pie b{color:var(--text);font-weight:600}
  .ej-acc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* siguiente paso */
  .paso-card{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
  .paso-card .lbl{font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .paso-card .exp{font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.015em;color:var(--yellow);margin:0}
  .paso-card .pend{font-size:17px;color:var(--text-2);margin:0}
  .mini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;max-width:260px}
  .mini i{height:6px;border-radius:3px;background:var(--surface-2)}
  .mini i.h{background:var(--yellow)}
  .mini i.e{background:var(--teal)}

  /* botones */
  .btn{appearance:none;font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:8px;background:var(--yellow);color:var(--on-yellow);border:0;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{filter:brightness(.95)}
  .btn-sec{appearance:none;background:transparent;color:var(--teal);border:1px solid var(--teal);font-weight:500;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .btn-sec:hover{background:var(--teal-soft)}
  .btn-lnk{appearance:none;background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:9px 6px;white-space:nowrap}
  .btn-lnk:hover{color:var(--text)}
  .btn-lnk.peligro{color:var(--crit)}
  .ir{font-weight:600;font-size:15px;color:var(--teal);white-space:nowrap}

  /* barra inferior */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,20,32,.96);backdrop-filter:blur(6px);border-top:1px solid var(--rule-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
  .barra-in{max-width:880px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap}
  .prog{flex:1;min-width:200px;font-size:14.5px;font-weight:600}
  .prog span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
  .acc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dd{position:relative}
  .menu{position:absolute;bottom:calc(100% + 8px);left:0;z-index:40;min-width:270px;background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:6px;display:grid;gap:2px}
  .menu button{appearance:none;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:7px;display:grid;gap:1px;cursor:pointer}
  .menu button:hover,.menu button:focus-visible{background:var(--surface-2);outline:none}
  .menu b{font-size:14px;font-weight:600}
  .menu span{font-size:12.5px;color:var(--muted)}
  #b-desc svg{transition:transform .15s}
  #b-desc[aria-expanded="true"] svg{transform:rotate(180deg)}
  .conf{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-2)}
  .aviso{flex-basis:100%;font-size:13.5px;color:var(--text-2);margin:-2px 0 0}
  .aviso:empty{display:none}

  footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--rule-strong);display:flex;gap:8px 18px;flex-wrap:wrap;align-items:baseline}
  footer .fn{font-weight:600;font-size:15px;margin:0}
  footer a{font-size:14px}

  @media (max-width:720px){
    .shell{padding:18px 16px 32px}
    .top{margin-bottom:36px}
    .campos{grid-template-columns:1fr}
    .card{padding:20px 18px}
    .frase{font-size:18px;line-height:2.25}
    .barra-in{padding:10px 16px;gap:8px 12px}
    .prog{flex-basis:100%;min-width:0}
    .lead{font-size:16.5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

              </span>
            </div>
          </div>
        </div>
      </details>
    </div>
  </section>

  <section class="sec" aria-labelledby="s3-t">
    <div class="sec-head">
      <span class="sec-n" data-t="s3n"></span>
      <h2 id="s3-t" data-t="sigPaso"></h2>
    </div>
    <div class="card paso-card" aria-live="polite">
      <div>
        <p class="exp" id="paso-exp" hidden></p>
        <p class="pend" id="paso-pend"></p>
        <div class="mini" id="mini" aria-hidden="true"></div>
      </div>
      <a class="ir" id="paso-ir" href="#" hidden></a>
    </div>
  </section>

  <footer>
    <p class="fn">Juan Carlos Franco Zafra</p>
    <a href="https://www.linkedin.com/in/juancarlosfranco/" target="_blank" rel="noopener">LinkedIn</a>
  </footer>
</div>

<div class="barra">
  <div class="barra-in">

    <div class="acc" id="acc">
      <div class="dd">
        <button class="btn" type="button" id="b-desc" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span data-t="bDesc"></span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-fmt="docx"><b data-t="fDocx"></b><span data-t="fDocxS"></span></button>
          <button type="button" role="menuitem" data-fmt="pdf"><b data-t="fPdf"></b><span data-t="fPdfS"></span></button>
        </div>
      </div>
      <button class="btn-lnk" type="button" id="b-copiar" data-t="bCopiar"></button>
      <button class="btn-lnk" type="button" id="b-limpiar" data-t="bLimpiar"></button>

    <div class="conf" id="conf" hidden>
      <span data-t="cPregunta"></span>
      <button class="btn-lnk peligro" type="button" id="b-si" data-t="cSi"></button>
      <button class="btn-lnk" type="button" id="b-no" data-t="cNo"></button>
    </div>
    <p class="aviso" id="aviso" role="status"></p>
  </div>
</div>
